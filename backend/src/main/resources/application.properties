server.port=8080

spring.application.name=casa-agrischool-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/casa_agrischool?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:NjM2RDZGNkU2NTc0Njg2OTZFNjc1MzY1NjM3MjY1NzQ0QjY1Nzk0NjZGNzI0MzYxNzM2MTQxNjc3MjY5NTM2MzY4NkY2RjZDNTYzMTIxMjE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuration de la taille maximale des fichiers (supports de cours PDF)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
